name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Base utilisee par `prisma generate` / le build ; les tests creent la
      # leur (base + stockage temporaires, cf. vitest.config.mts).
      DATABASE_URL: file:./ci.db
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Tests (unitaires + integration)
        run: npm test

      - name: Audit des dependances de production
        run: npm audit --omit=dev --audit-level=high
