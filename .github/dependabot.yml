version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      next:
        patterns: ["next", "eslint-config-next"]
      prisma:
        patterns: ["prisma", "@prisma/*"]
      # react-dom exige la meme version exacte de react : separees, les deux
      # PR echouent chacune a `npm ci` (conflit de peer dependency).
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
    ignore:
      # Les types doivent suivre le runtime (Node 22, cf. README et CI) :
      # une majeure plus recente exposerait des API absentes en production.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
